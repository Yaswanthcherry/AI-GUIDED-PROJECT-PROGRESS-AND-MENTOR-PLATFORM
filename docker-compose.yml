# =====================================================================
# AI-Guided Project Progress Tracking Platform — local development stack
#
#   cp .env.example .env     # then set a strong JWT_SECRET_KEY / DB password
#   docker compose up --build
#
# Frontend:  http://localhost:8080   (nginx proxies /api -> backend)
# Backend:   http://localhost:8000   (Swagger at /docs, health at /health)
# Postgres:  localhost:5432
# =====================================================================
name: aapm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aapm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aapm}
      POSTGRES_DB: ${POSTGRES_DB:-aapm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # remove this mapping in production; backend reaches db internally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aapm} -d ${POSTGRES_DB:-aapm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host/port for the compose network (db service name)
      DATABASE_URL: postgresql://${POSTGRES_USER:-aapm}:${POSTGRES_PASSWORD:-aapm}@db:5432/${POSTGRES_DB:-aapm}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin proxy — no hardcoded host baked into the JS bundle
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
